<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0d0d0d;
        color: #e0e0e0;
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code",
          ui-monospace, monospace;
        font-size: 14px;
        line-height: 1.6;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ── */
      header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-bottom: 1px solid #1e1e1e;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        background: #3fb950;
        border-radius: 50%;
      }

      header h1 {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.05em;
      }

      header .thread-id {
        margin-left: auto;
        font-size: 11px;
        color: #404040;
      }

      /* ── Messages ── */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      #messages.empty {
        justify-content: center;
      }

      #messages::-webkit-scrollbar {
        width: 3px;
      }
      #messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #messages::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 2px;
      }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 820px;
        width: 100%;
      }

      /* user */
      .msg.user .label {
        color: #6e5fdb;
        font-size: 12px;
      }
      .msg.user .body {
        color: #888;
        padding-left: 2px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ai */
      .msg.ai .label {
        color: #3fb950;
        font-size: 12px;
      }
      .msg.ai .body {
        color: #dde1e7;
      }

      /* markdown inside ai body */
      .msg.ai .body p {
        margin: 4px 0;
      }
      .msg.ai .body h1,
      .msg.ai .body h2,
      .msg.ai .body h3 {
        color: #fff;
        margin: 14px 0 6px;
      }
      .msg.ai .body ul,
      .msg.ai .body ol {
        padding-left: 22px;
        margin: 6px 0;
      }
      .msg.ai .body li {
        margin: 2px 0;
      }
      .msg.ai .body a {
        color: #7c9ef8;
        text-decoration: none;
      }
      .msg.ai .body a:hover {
        text-decoration: underline;
      }
      .msg.ai .body blockquote {
        border-left: 3px solid #2d2d2d;
        padding-left: 12px;
        color: #888;
        margin: 6px 0;
      }
      .msg.ai .body code {
        background: #1a1a1a;
        border: 1px solid #252525;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 13px;
        color: #7dd3fc;
      }
      .msg.ai .body pre {
        background: #111;
        border: 1px solid #222;
        border-radius: 6px;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 10px 0;
      }
      .msg.ai .body pre code {
        background: none;
        border: none;
        padding: 0;
        color: #e0e0e0;
        font-size: 13px;
      }
      .msg.ai .body table {
        border-collapse: collapse;
        margin: 10px 0;
        width: 100%;
        font-size: 13px;
      }
      .msg.ai .body th,
      .msg.ai .body td {
        border: 1px solid #222;
        padding: 6px 12px;
        text-align: left;
      }
      .msg.ai .body th {
        background: #141414;
        color: #aaa;
      }
      .msg.ai .body hr {
        border: none;
        border-top: 1px solid #1e1e1e;
        margin: 12px 0;
      }

      /* streaming cursor */
      .cursor {
        display: inline-block;
        width: 7px;
        height: 13px;
        background: #6e5fdb;
        border-radius: 1px;
        vertical-align: text-bottom;
        animation: blink 0.9s step-end infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* ── Input area ── */
      #input-area {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        padding: 14px 24px 24px;
        border-top: 1px solid #1a1a1a;
        background: #0d0d0d;
      }

      #input-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 720px;
        background: #111;
        border: 1px solid #222;
        border-radius: 8px;
        padding: 10px 16px;
      }

      .prompt {
        color: #6e5fdb;
        font-size: 15px;
        user-select: none;
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e0e0e0;
        font-family: inherit;
        font-size: 14px;
        caret-color: #6e5fdb;
      }
      #input::placeholder {
        color: #333;
      }
      #input:disabled {
        opacity: 0.4;
      }

      #send-btn {
        background: none;
        border: 1px solid #252525;
        color: #505050;
        padding: 4px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        transition: border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }
      #send-btn:hover:not(:disabled) {
        border-color: #6e5fdb;
        color: #6e5fdb;
      }
      #send-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }

      /* empty state */
      #empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #2a2a2a;
        pointer-events: none;
        user-select: none;
      }
      #empty .big {
        font-size: 32px;
      }
      #empty .hint {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="status-dot"></div>
      <h1>Agent</h1>
      <span class="thread-id" id="thread-label"></span>
    </header>

    <div id="messages" class="empty">
      <div id="empty">
        <div class="big">_</div>
        <div class="hint">输入消息开始对话</div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-inner">
        <span class="prompt">›</span>
        <input
          id="input"
          type="text"
          placeholder="有什么可以帮你的？"
          autofocus
        />
        <button id="send-btn">Enter ↵</button>
      </div>
    </div>

    <script>
      // 同一标签页内刷新保留对话，关闭标签页才是新对话
      const threadId =
        sessionStorage.getItem("threadId") ||
        (() => {
          const id = "web-" + Math.random().toString(36).slice(2, 10);
          sessionStorage.setItem("threadId", id);
          return id;
        })();
      document.getElementById("thread-label").textContent = threadId;

      const messagesEl = document.getElementById("messages");
      const emptyEl = document.getElementById("empty");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send-btn");

      marked.use({ breaks: true, gfm: true });

      function escapeHtml(t) {
        return t
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addUserMsg(text) {
        if (emptyEl) emptyEl.remove();
        messagesEl.classList.remove("empty");
        const div = document.createElement("div");
        div.className = "msg user";
        div.innerHTML = `<div class="label">you</div><div class="body">${escapeHtml(
          text
        )}</div>`;
        messagesEl.appendChild(div);
        scrollBottom();
      }

      function createAiMsg() {
        const div = document.createElement("div");
        div.className = "msg ai";
        div.innerHTML = `<div class="label">agent</div><div class="body"></div>`;
        messagesEl.appendChild(div);
        scrollBottom();
        return div.querySelector(".body");
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = "";
        inputEl.disabled = true;
        sendBtn.disabled = true;

        addUserMsg(text);

        const body = createAiMsg();
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        body.appendChild(cursor);

        let raw = "";

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, thread_id: threadId }),
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            raw += decoder.decode(value, { stream: true });
            body.innerHTML = escapeHtml(raw);
            body.appendChild(cursor);
            scrollBottom();
          }

          // render markdown after stream ends
          body.innerHTML = marked.parse(raw);
        } catch (e) {
          body.innerHTML = `<span style="color:#f87171">错误：${escapeHtml(
            e.message
          )}</span>`;
        }

        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        scrollBottom();
      }

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      sendBtn.addEventListener("click", send);
    </script>
  </body>
</html>
