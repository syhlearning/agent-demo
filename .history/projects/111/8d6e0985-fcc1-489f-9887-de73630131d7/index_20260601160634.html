<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>三界 · 深度交互实验室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.root-container{--bg:#07070f;--card:rgba(255,255,255,0.02);--border:rgba(255,255,255,0.05);--text:#eeeef4;--dim:#7a7a96;--c1:#6c5ce7;--c2:#00cec9;--c3:#fd79a8;--c4:#fdcb6e;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:30px 16px 80px;background-image:radial-gradient(ellipse 700px 500px at 15% 15%,rgba(108,92,231,0.05) 0%,transparent 70%),radial-gradient(ellipse 600px 600px at 85% 25%,rgba(0,206,201,0.03) 0%,transparent 70%),radial-gradient(ellipse 500px 500px at 50% 75%,rgba(253,121,168,0.03) 0%,transparent 70%)}
.head{text-align:center;max-width:800px;margin:0 auto 40px}
.head h1{font-size:clamp(28px,5vw,48px);font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3),var(--c4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.03em;line-height:1.2}
.head p{color:var(--dim);font-size:15px;margin-top:10px}
.head .divider{width:70px;height:3px;margin:14px auto 0;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:28px;padding:32px 28px 28px;transition:transform .4s cubic-bezier(.22,.68,0,.98),box-shadow .4s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 30px 100px rgba(0,0,0,.5)}
.card .hd{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.card .hd .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.card .hd .inf{flex:1}
.card .hd .inf h2{font-size:19px;font-weight:600}
.card .hd .inf .sub{font-size:13px;color:var(--dim);margin-top:2px}
.card .hd .tag{font-size:10px;font-weight:500;padding:3px 10px;border-radius:30px;background:rgba(255,255,255,.04);color:var(--dim);flex-shrink:0;text-transform:uppercase;letter-spacing:.5px}
.c1 .ic{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}.c1 .tag{border:1px solid rgba(108,92,231,.2);color:#a29bfe}
.c2 .ic{background:linear-gradient(135deg,#00cec9,#55efc4)}.c2 .tag{border:1px solid rgba(0,206,201,.2);color:#55efc4}
.c3 .ic{background:linear-gradient(135deg,#fd79a8,#fdcb6e)}.c3 .tag{border:1px solid rgba(253,121,168,.2);color:#fd79a8}
.card .bd{min-height:280px;display:flex;flex-direction:column}
.m1 .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.m1 .board .tile{aspect-ratio:1/1;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.01));display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s cubic-bezier(.22,.68,0,.98);position:relative;transform-style:preserve-3d;perspective:400px}
.m1 .board .tile .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden}
.m1 .board .tile .front{background:linear-gradient(145deg,rgba(108,92,231,.12),rgba(108,92,231,.04));z-index:2}
.m1 .board .tile .front::after{content:'?';font-size:22px;color:rgba(255,255,255,.15);font-weight:600}
.m1 .board .tile .back{background:rgba(0,0,0,.3);transform:rotateY(180deg);z-index:1;font-size:34px}
.m1 .board .tile.flipped{transform:rotateY(180deg)}
.m1 .board .tile.matched{transform:rotateY(180deg);border-color:rgba(85,239,196,.3)}
.m1 .board .tile.matched .back{background:rgba(85,239,196,.08)}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.m1 .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.m1 .stats .s{flex:1;min-width:60px;background:rgba(255,255,255,.02);border-radius:10px;padding:10px 12px;text-align:center;border:1px solid rgba(255,255,255,.03)}
.m1 .stats .s .n{font-size:20px;font-weight:700;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums}
.m1 .stats .s .l{font-size:10px;color:var(--dim);margin-top:3px}
.m1 .actions{display:flex;gap:10px;flex-wrap:wrap}
.m1 .actions button{padding:9px 22px;border:none;border-radius:12px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.m1 .actions button:active{transform:scale(.95)}
.m1 .actions .p{background:linear-gradient(135deg,#6c5ce7,#8b7cf7);color:#fff}.m1 .actions .p:hover{opacity:.85}
.m1 .actions .s{background:rgba(255,255,255,.05);color:var(--dim)}.m1 .actions .s:hover{background:rgba(255,255,255,.08);color:var(--text)}
.m1 .status{font-size:13px;color:var(--dim);margin-top:12px;text-align:center}.m1 .status strong{color:var(--text);font-weight:600}
.m2 .canvas-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.m2 .canvas-toolbar .color-picker{display:flex;gap:6px}
.m2 .canvas-toolbar .color-picker .cpt{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.m2 .canvas-toolbar .color-picker .cpt:hover{transform:scale(1.15)}
.m2 .canvas-toolbar .color-picker .cpt.active{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.15);transform:scale(1.1)}
.m2 .canvas-toolbar .size-ctrl{display:flex;align-items:center;gap:8px}
.m2 .canvas-toolbar .size-ctrl label{font-size:12px;color:var(--dim)}
.m2 .canvas-toolbar .size-ctrl input[type="range"]{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);outline:none}
.m2 .canvas-toolbar .size-ctrl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#00cec9,#55efc4);cursor:pointer;border:2px solid var(--bg)}
.m2 .canvas-toolbar .size-ctrl .sv{font-size:12px;font-weight:600;color:var(--text);min-width:20px;text-align:center}
.m2 .canvas-toolbar .actns{display:flex;gap:8px;margin-left:auto}
.m2 .canvas-toolbar .actns button{padding:7px 16px;border:none;border-radius:10px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.m2 .canvas-toolbar .actns button:active{transform:scale(.94)}
.m2 .canvas-toolbar .actns .p{background:rgba(255,255,255,.08);color:var(--text)}.m2 .canvas-toolbar .actns .p:hover{background:rgba(255,255,255,.12)}
.m2 .canvas-toolbar .actns .d{background:rgba(253,121,168,.15);color:#fd79a8}.m2 .canvas-toolbar .actns .d:hover{background:rgba(253,121,168,.25)}
.m2 .pixel-grid-wrap{background:rgba(0,0,0,.25);border-radius:14px;border:1px solid rgba(255,255,255,.04);overflow:hidden;position:relative}
.m2 .pixel-grid{display:grid;gap:1px;background:rgba(255,255,255,.03);user-select:none}
.m2 .pixel-grid .px{aspect-ratio:1/1;background:rgba(255,255,255,.02);border-radius:1px;cursor:pointer;transition:background .08s}
.m2 .pixel-grid .px:hover{filter:brightness(1.3)}
.m2 .info-row{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.m2 .info-row span strong{color:var(--text);font-weight:600}
.m3 .sandbox-wrap{position:relative;background:rgba(0,0,0,.25);border-radius:16px;border:1px solid rgba(255,255,255,.04);overflow:hidden;height:300px;cursor:pointer}
.m3 .sandbox-wrap canvas{display:block;width:100%;height:100%}
.m3 .sandbox-wrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#4a4a66;pointer-events:none;letter-spacing:.5px;transition:opacity .4s}
.m3 .sandbox-wrap .hint.hid{opacity:0}
.m3 .sb-controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.m3 .sb-controls button{padding:8px 18px;border:none;border-radius:10px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.m3 .sb-controls button:active{transform:scale(.94)}
.m3 .sb-controls .p{background:linear-gradient(135deg,#fd79a8,#e17055);color:#fff}.m3 .sb-controls .p:hover{opacity:.85}
.m3 .sb-controls .s{background:rgba(255,255,255,.05);color:var(--dim)}.m3 .sb-controls .s:hover{background:rgba(255,255,255,.08);color:var(--text)}
.m3 .sb-controls .mode-group{display:flex;gap:4px;background:rgba(255,255,255,.04);border-radius:10px;padding:3px}
.m3 .sb-controls .mode-group .m{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-size:16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.m3 .sb-controls .mode-group .m:hover{color:var(--text)}.m3 .sb-controls .mode-group .m.active{background:rgba(255,255,255,.08);color:var(--text)}
.m3 .sb-controls .size-sl{display:flex;align-items:center;gap:6px}
.m3 .sb-controls .size-sl label{font-size:11px;color:var(--dim)}
.m3 .sb-controls .size-sl input[type="range"]{-webkit-appearance:none;appearance:none;width:60px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);outline:none}
.m3 .sb-controls .size-sl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#fd79a8,#fdcb6e);cursor:pointer;border:2px solid var(--bg)}
.m3 .sb-info{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--dim)}.m3 .sb-info span strong{color:var(--text);font-weight:600}
@media(max-width:768px){.root-container{padding:20px 12px 60px}.card{padding:22px 16px 20px;border-radius:20px}.card .bd{min-height:220px}.m1 .board{gap:8px}.m1 .board .tile{font-size:22px}.m2 .pixel-grid{gap:.5px}.m3 .sandbox-wrap{height:240px}}
@media(max-width:480px){.card{padding:18px 12px 16px;border-radius:16px}.m2 .canvas-toolbar .actns{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="root-container">
<header class="head"><h1>✦ 三界 · 深度交互实验室</h1><p>记忆翻牌 · 像素画板 · 重力沙盘 — 每个模块都是一次沉浸式互动实验</p><div class="divider"></div></header>
<div class="wrap">

<div class="card c1 m1">
<div class="hd"><div class="ic">🧠</div><div class="inf"><h2>记忆翻牌</h2><div class="sub">记住图案位置，配对消除所有卡片</div></div><span class="tag">点击翻转</span></div>
<div class="bd">
<div class="board" id="board"></div>
<div class="stats">
<div class="s"><div class="n" id="moves">0</div><div class="l">步数</div></div>
<div class="s"><div class="n" id="pairs">0</div><div class="l">配对</div></div>
<div class="s"><div class="n" id="timer">0s</div><div class="l">用时</div></div>
</div>
<div class="actions">
<button class="p" id="newGameBtn">🔄 新一局</button>
<button class="s" id="easyBtn">😊 简单 (4x3)</button>
<button class="s" id="hardBtn">😈 困难 (4x5)</button>
</div>
<div class="status" id="gameStatus">✦ 点击卡片开始游戏</div>
</div>
</div>

<div class="card c2 m2">
<div class="hd"><div class="ic">🎨</div><div class="inf"><h2>像素画板</h2><div class="sub">逐像素绘制，可选择颜色和笔刷大小</div></div><span class="tag">点击/拖拽</span></div>
<div class="bd">
<div class="canvas-toolbar">
<div class="color-picker" id="colorPicker"></div>
<div class="size-ctrl"><label>🖌</label><input type="range" id="brushSize" min="1" max="5" value="2"><span class="sv" id="brushSizeVal">2</span></div>
<div class="actns"><button class="d" id="clearCanvasBtn">✕ 清空</button><button class="p" id="fillCanvasBtn">◼ 填充</button></div>
</div>
<div class="pixel-grid-wrap"><div class="pixel-grid" id="pixelGrid"></div></div>
<div class="info-row"><span>🎯 像素 <strong id="pxCount">0</strong></span><span>🖌 笔刷 <strong id="brushSizeLabel">2x2</strong></span><span>💡 鼠标拖拽连续绘制</span></div>
</div>
</div>

<div class="card c3 m3">
<div class="hd"><div class="ic">🌊</div><div class="inf"><h2>重力沙盘</h2><div class="sub">点击/拖拽生成沙粒水粒，模拟重力下落与堆积</div></div><span class="tag">物理模拟</span></div>
<div class="bd">
<div class="sandbox-wrap" id="sandboxWrap">
<canvas id="sandboxCanvas"></canvas>
<div class="hint" id="sandboxHint">✦ 点击生成沙粒 · 观察物理堆积 ✦</div>
</div>
<div class="sb-controls">
<button class="p" id="clearSandBtn">✕ 清空</button>
<button class="s" id="explodeSandBtn">💥 爆炸</button>
<button class="s" id="wallSandBtn">🧱 建墙</button>
<div class="mode-group">
<button class="m active" data-mode="sand" title="沙子">🟡</button>
<button class="m" data-mode="water" title="水">🔵</button>
<button class="m" data-mode="eraser" title="橡皮">🧹</button>
</div>
<div class="size-sl"><label>⚙</label><input type="range" id="sandSize" min="1" max="5" value="2"></div>
</div>
<div class="sb-info"><span>⏳ 沙粒 <strong id="sandCount">0</strong></span><span>💧 水滴 <strong id="waterCount">0</strong></span><span>🔄 每帧自动模拟物理</span></div>
</div>
</div>

</div>
</div>
</body>
</html>
